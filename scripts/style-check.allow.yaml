# Findings of scripts/style-check.js that are deliberate (D5). Each entry names the
# finding exactly and says why it stays; an entry without a reason is not applied.
# Allowed findings are still listed in the report, with the reason.
#
# - check: gitignore            # the check id (helpers, identical, templates, copies, license,
#                               # husky, engines, changelog-files, plugin-config, gitignore)
#   repo: nera-website          # the repo as the report names it; `(fleet)` for helpers,
#                               # `templates/<layer>` for a template file
#   item: public                # the finding's item, as in the report (without backticks):
#                               # the helper's name, the identical file's path, the copy's path
#   reason: the site's build output, never committed
- check: gitignore
  repo: nera-highlightjs-pug
  item: dist
  reason: dist/ is the committed esbuild output; test.yml fails when it is stale
- check: gitignore
  repo: generator
  item: public
  reason: the build output of the engine's bundled demo site (npm run render)
- check: gitignore
  repo: generator
  item: '*.tgz'
  reason: npm pack tarballs of the engine, installed by path to try a release before it is tagged
- check: gitignore
  repo: nera-mcp
  item: '*.mcpb'
  reason: the Desktop extension bundle `npm run mcpb` writes into the repo root
- check: gitignore
  repo: nera-mcp
  item: /docs
  reason: written by prepack (scripts/fetch-docs.js) and shipped through `files`, never committed
- check: gitignore
  repo: nera-mcp
  item: /skills
  reason: written by prepack (scripts/sync-skill.js) and shipped through `files`, never committed
- check: gitignore
  repo: nera-plugin-simple-page-list
  item: test-temp
  reason: the publish-template test writes its throwaway site into test-temp/
- check: gitignore
  repo: nera-website
  item: .theme-demos
  reason: the theme demo sites scripts/theme-demos.js builds for deploy.yml, never committed
- check: identical
  repo: nera-theme-example
  item: eslint.config.js
  reason: the example theme has no JavaScript; its CI compiles the Pug templates instead of linting
- check: identical
  repo: nera-theme-example
  item: test/helpers/html.js
  reason: the example theme has no test suite; its CI compiles the Pug templates instead
- check: husky
  repo: nera-theme-example
  item: husky
  reason: the example theme has no lint and no tests (its CI compiles the Pug templates), so a pre-commit or pre-push hook would have nothing to run
- check: templates
  repo: templates/common
  item: eslint.config.js
  reason: the templates lint with the @nera-static/stan editor export (D5), which the fleet adopts when nera-stan 1.0.0 is released
- check: identical
  repo: generator
  item: eslint.config.js
  reason: core lints with the @nera-static/stan editor export (D5), like templates/common; the fleet majority still has the pre-stan config until each repo moves to nera-stan
- check: helpers
  repo: (fleet)
  item: parsePage
  reason: core's parsePage renders the page body with markdown-it, which plugin-utils does not carry; the shared part (splitFrontmatter, FRONTMATTER_OPTIONS) already comes from plugin-utils
